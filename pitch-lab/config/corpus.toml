# Pitch Lab — deterministic synthetic corpus generator config (§11).
#
# THIS FILE IS THE COMMITTED GENERATOR CONFIG (§11.4): every recipe
# parameter is owner-visible here; changing masterSeed (or any parameter)
# = a new corpus version — regenerate assets/corpus/ with tools/corpus_gen
# and T-C1 / `corpus_gen --verify` gate the change.
#
# Item schema (frozen cycle 2):
#   id          asset directory name (assets/corpus/<id>/), "syn-" prefix
#   class       generator class (see src/core/corpus_gen.cpp table)
#   sampleRate  must be in the §8 supported set
#   durationSec seconds (transients 2 s per §11.2; default 5 s)
#   channels    1|2 — per-class (v0.1 instantiation of "mono and stereo
#               variants where meaningful": the two stereo-noise classes
#               are the channel-behaviour fixtures; all others mono)
#   params      class-specific recipe parameters (unknown keys rejected)
#
# Per-item seeds derive as splitMix64(masterSeed XOR fnv1a64(id)) (§11.4);
# stochastic streams use the PCG64 consumer tag "corpus" (§11.1).
version = "v0.1"
masterSeed = 0x50E5A1AB

# --- §11.2 sine: 440 Hz, 5 s, at 44.1/48/96/192 kHz -------------------------
[[item]]
id = "syn-sine-440-5s-44k1"
class = "sine"
sampleRate = 44100
durationSec = 5.0
channels = 1
params = { freqHz = 440.0 }

[[item]]
id = "syn-sine-440-5s-48k"
class = "sine"
sampleRate = 48000
durationSec = 5.0
channels = 1
params = { freqHz = 440.0 }

[[item]]
id = "syn-sine-440-5s-96k"
class = "sine"
sampleRate = 96000
durationSec = 5.0
channels = 1
params = { freqHz = 440.0 }

[[item]]
id = "syn-sine-440-5s-192k"
class = "sine"
sampleRate = 192000
durationSec = 5.0
channels = 1
params = { freqHz = 440.0 }

